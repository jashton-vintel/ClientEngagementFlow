<h1>Processing Jobs</h1>

<table>
  <thead>
    <tr>
      <th>Job ID</th>
      <th>Document ID</th>
      <th>Status</th>
      <th>Created</th>
    </tr>
  </thead>

  <tbody>
    @for (job of jobs(); track job.id) {
    <tr>
      <td>{{ job.id }}</td>
      <td>{{ job.documentId }}</td>
      <td>{{ job.status }}</td>
      <td>{{ job.createdUtc }}</td>
    </tr>
    }
  </tbody>
</table>

<button (click)="login()">Sign in</button>


<div>
  <input type="text"
         placeholder="Document ID"
         [value]="documentId()"
         (input)="documentId.set($any($event.target).value)" />

  <button (click)="submitJob()">
    Submit job
  </button>
</div>
